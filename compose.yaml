services:
  arrbiter:
    build: .
    container_name: arrbiter
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
      # Only token-authenticated webhook requests are served on this LAN port.
      - "8788:8788"
    volumes:
      - arrbiter_config:/config
      # Mount only dedicated disposable directories here. Never mount your library.
      - ./data/disposable:/cleanup/disposable
    environment:
      ARRBITER_PORT: "8787"
      ARRBITER_WEBHOOK_PORT: "8788"
      # Blank values use the built-in admin / arrbiter login on a new volume.
      ARRBITER_DEFAULT_USERNAME: ""
      ARRBITER_DEFAULT_PASSWORD: ""
      # Set true when Arrbiter is served over HTTPS by a reverse proxy.
      ARRBITER_COOKIE_SECURE: "false"

volumes:
  arrbiter_config:
